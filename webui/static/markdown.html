<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 阅读器 - 论文库</title>
  <link rel="stylesheet" href="/static/styles.css?v=26">
  <script src="/static/markdown-reader.js?v=2" defer></script>
</head>
<body>
  <header class="markdown-header">
    <div class="header-inner">
      <span id="markdown-title" class="header-note">Markdown 阅读器</span>
      <nav class="markdown-tools" aria-label="Markdown 阅读工具">
        <a href="/" title="返回论文库">论文库</a>
        <a id="markdown-pdf-link" href="#" title="打开 PDF 阅读器">PDF</a>
        <a id="markdown-download" href="#" download hidden>下载 .md</a>
        <button id="markdown-regenerate" type="button" hidden>重新生成</button>
      </nav>
    </div>
  </header>
  <main class="markdown-main">
    <p id="markdown-status" class="markdown-status" role="status" aria-live="polite">正在读取 Markdown…</p>
    <article id="markdown-content" class="markdown-prose" aria-label="论文 Markdown 内容"></article>
  </main>
</body>
</html>
