<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>researcheR</title>
  <link rel="stylesheet" href="/static/styles.css?v=29">
  <script src="/static/app.js?v=24" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>researcheR</h1>
      <span class="header-note">个人文献管理</span>
    </div>
  </header>
  <main>
    <section aria-labelledby="upload-heading">
      <h2 id="upload-heading">添加论文</h2>
      <form id="upload-form" class="upload-panel">
        <input id="file-input" type="file" name="files" accept="application/pdf,.pdf" multiple required>
        <label class="file-picker" for="file-input">
          <span class="file-copy">
            <strong>选择 PDF 文件</strong>
            <small>可多选，上传后逐页 OCR 并生成可下载的 JSON</small>
          </span>
          <span class="choose-label">浏览文件</span>
        </label>
        <button type="submit">上传</button>
        <ul id="pending-list" aria-label="待上传文件"></ul>
        <p id="message" role="status"></p>
      </form>
    </section>
    <section class="library-section" aria-labelledby="library-heading">
      <div class="section-heading">
        <h2 id="library-heading">我的论文</h2>
        <div class="library-controls">
          <label class="search-control" for="title-search">
            <span>搜索标题</span>
            <input id="title-search" type="search" placeholder="输入标题" autocomplete="off">
          </label>
          <button type="button" id="star-filter" aria-pressed="false">仅看星标</button>
          <span class="paper-total">共 <span id="paper-count">0</span> 篇</span>
        </div>
      </div>
      <ul id="paper-list" aria-label="论文列表"></ul>
      <nav id="paper-pagination" class="paper-pagination" aria-label="论文列表分页" hidden>
        <button type="button" id="previous-page" aria-label="上一页">上一页</button>
        <span id="page-status" aria-live="polite"></span>
        <button type="button" id="next-page" aria-label="下一页">下一页</button>
      </nav>
    </section>
  </main>
  <dialog id="paper-dialog" aria-labelledby="paper-dialog-title">
    <form id="paper-form">
      <div class="dialog-heading">
        <h2 id="paper-dialog-title">编辑论文</h2>
        <button type="button" class="close-button" id="close-dialog" aria-label="关闭">×</button>
      </div>
      <div class="paper-editor">
        <img id="paper-preview" alt="PDF 第一页预览">
        <div class="paper-fields">
          <div class="metadata-heading">
            <h3>论文信息</h3>
            <button type="button" id="extract-metadata">提取标题和摘要</button>
          </div>
          <p id="metadata-status" role="status" aria-live="polite"></p>
          <label>标题<input id="paper-title" name="title" required></label>
          <label>发表会议/期刊<input id="paper-venue" name="venue"></label>
          <label>摘要（Abstract）<textarea id="paper-abstract" name="abstract" rows="7"></textarea></label>
          <small class="metadata-help">从论文前三页提取原标题和完整摘要，不翻译、不总结；使用 DeepSeek API，检查后点击保存。</small>
        </div>
      </div>
      <section class="references-section" aria-labelledby="references-title">
        <div class="references-toolbar">
          <div><h3 id="references-title">参考文献 <span id="references-count">0 条</span></h3>
            <p class="references-help">提取论文中引用的全部文献，按原文顺序逐条整理；不会生成本篇论文自身的引用。</p></div>
          <button type="button" id="extract-reference">提取全部参考文献</button>
        </div>
        <div class="references-controls">
          <input type="search" id="references-search" placeholder="搜索标题、作者、年份或 DOI" aria-label="搜索参考文献">
          <button type="button" id="add-reference">手动添加</button>
        </div>
        <p id="references-status" role="status" aria-live="polite"></p>
        <div id="references-list" class="references-list"></div>
        <details id="legacy-reference" hidden>
          <summary>旧版 Reference 文本（保留，未自动转换）</summary>
          <label for="paper-reference">原始内容</label>
          <textarea id="paper-reference" name="reference" rows="5"></textarea>
        </details>
        <p class="references-help">使用现有 DeepSeek 配置扫描全文，可能产生多次 API 用量。提取后请核对原文，点击“保存”才写入论文信息。</p>
      </section>
      <div class="dialog-actions">
        <button type="button" id="delete-paper">删除</button>
        <span id="dialog-message" role="status"></span>
        <button type="submit" id="save-paper">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
