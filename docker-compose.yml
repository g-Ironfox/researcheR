services:
  webui:
    build: ./webui
    container_name: webui_researcheR
    ports:
      - "8667:8000"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_DB=${MONGO_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TZ=${TZ}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_CHAT_MODEL=${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
      - TASK_WORKERS=${TASK_WORKERS:-3}
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - researcheR_net

  worker:
    build: ./webui
    container_name: worker_researcheR
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
      - TASK_WORKERS=${TASK_WORKERS:-3}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_CHAT_MODEL=${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      - TZ=${TZ}
    command: ["python", "worker.py"]
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - researcheR_net
    
  redis:
    image: redis:7-alpine
    container_name: redis_researcheR
    ports:
      - "6366:6379"               # 可选，暴露给宿主机
    volumes:
      - ./data/redis:/data        # Redis 持久化
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - researcheR_net

  mongodb:
    image: mongo:8
    container_name: mongodb_researcheR
    ports:
      - "27039:27017"
    volumes:
      - ./data/mongo:/data/db     # MongoDB 数据持久化
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    networks:
      - researcheR_net

networks:
  researcheR_net:
    driver: bridge
